name: NEXUS VPN Build

on:
  workflow_dispatch:
  push:
    branches:
      - nexus-build

permissions:
  contents: read

jobs:
  build:
    name: Build NEXUS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Build HEV tunnel libraries
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs V2rayNG/app/

      - name: Download Xray library
        run: |
          mkdir -p V2rayNG/app/libs
          curl -fL -o V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar

      - name: Build APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-VPN-APK
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
